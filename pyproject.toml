[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foureyes"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6",
  "pyyaml>=6.0", "httpx>=0.27", "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.100"]
ml = ["transformers>=4.40", "torch>=2.2"]
harness = ["reportlab>=4.0", "pypdf>=4.0", "python-multipart>=0.0.9"]

[project.scripts]
foureyes = "foureyes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
foureyes = ["ui_dist/**/*"]
harness = ["demo_documents/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-q"
